[tool.poetry]
name = "ludomancer"
version = "0.1.0"
description = "Steam backlog recommender desktop app"
authors = ["mkkom <mkkom@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "ludomancer", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.11.0"
pydantic-settings = "^2.9.0"
httpx = "^0.28.1"
anthropic = "^0.57.1"
openai = "^1.78.1"
numpy = "^2.2.5"
scipy = "^1.15.3"
scikit-learn = "^1.6.1"
pyqt6 = "^6.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.1.1"
ruff = "^0.11.9"

[tool.poetry.scripts]
ludomancer = "ludomancer.gui.app:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
